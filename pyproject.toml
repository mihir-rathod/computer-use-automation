[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Computer-use automation system: LLM-driven discovery, artifact recording, deterministic replay, and human escalation against a legacy-style bank app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "playwright>=1.48",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "artifacts_lib", "clinic", "discover", "escalation", "evidence_lib", "repair", "replay", "runs", "safety", "surface"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"runtime.py" = "runtime.py"
"observability.py" = "observability.py"
"mcp_server.py" = "mcp_server.py"
