<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}MockBank{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<table class="page-frame" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="hdr">
      <table cellpadding="4" cellspacing="0" border="0" width="100%">
        <tr>
          <td class="logo">MockBank <span class="ver">Core v3.2</span></td>
          <td align="right">
            {% if is_logged_in(request) %}
            <form method="post" action="/logout" class="logout-form">
              <button type="submit">Log Out</button>
            </form>
            {% endif %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="content">
      <table cellpadding="10" cellspacing="0" border="0" width="100%">
        <tr>
          <td>
            {% block content %}{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

{% if show_terms_modal %}
  {% include "_terms_modal.html" %}
{% endif %}
</body>
</html>
